[project]
name = "ai-portfolio-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "google-genai>=2.30.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# Security floors for transitive dependencies; do not force parent upgrades.
constraint-dependencies = [
    "certifi>=2026.10.19",
    "pyasn1>=0.6.5",
]
